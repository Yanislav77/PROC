      properties:
        type:
          type: string
          enum: [top_up_mobile]
        details:
          description: Mobile top-up parameters
          $ref: '#/components/schemas/ActionDetailsTopUpMobile'

    ResponseCancelled:
      title: cancelled
      description: Cancelled transaction
      allOf:
        - $ref: '#/components/schemas/ResponseBaseTerminal'
        - type: object
          properties:
            status:
              type: string
              enum: [cancelled]
            transaction_data:
              $ref: '#/components/schemas/ResponseTransactionData'

    ResponseRejected:
      title: rejected
      description: Transaction rejected by acquirer or issuer
      allOf:
        - $ref: '#/components/schemas/ResponseBaseTerminal'
        - type: object
          properties:
            status:
              type: string
              enum: [rejected]
            transaction_data:
              $ref: '#/components/schemas/ResponseTransactionData'
            rejected_data:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  description: Machine-readable rejection code
                  examples:
                    - do_not_honor
                message:
                  type: string
                  description: Human-readable rejection reason
                  examples:
                    - Transaction declined by issuer

    ResponseRefunded:
      title: refunded
      description: Refunded transaction
      allOf:
        - $ref: '#/components/schemas/ResponseBaseTerminal'
        - type: object
          properties:
            status:
              type: string
              enum: [refunded]
            transaction_data:
              $ref: '#/components/schemas/ResponseTransactionData'

    # ── Webhooks ─────────────────────────────────────────────────

    WebhookPayload:
      description: Webhook notification payload. Structure depends on event_type field.
      oneOf:
        - $ref: '#/components/schemas/WebhookEventCompleted'
        - $ref: '#/components/schemas/WebhookEventAuthorized'
        - $ref: '#/components/schemas/WebhookEventWaitingAction'
        - $ref: '#/components/schemas/WebhookEventCancelled'
        - $ref: '#/components/schemas/WebhookEventRejected'
        - $ref: '#/components/schemas/WebhookEventRefunded'
      discriminator:
        propertyName: event_type
        mapping:
          transaction.completed:      '#/components/schemas/WebhookEventCompleted'
          transaction.authorized:     '#/components/schemas/WebhookEventAuthorized'
          transaction.waiting_action: '#/components/schemas/WebhookEventWaitingAction'
          transaction.cancelled:      '#/components/schemas/WebhookEventCancelled'
          transaction.rejected:       '#/components/schemas/WebhookEventRejected'
          transaction.refunded:       '#/components/schemas/WebhookEventRefunded'

    WebhookEventCompleted:
      title: transaction.completed
      description: Successfully completed transaction notification
      allOf:
        - $ref: '#/components/schemas/ResponseCompleted'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.completed]
              description: Event type identifier

    WebhookEventAuthorized:
      title: transaction.authorized
      description: Transaction with funds held pending capture notification
      allOf:
        - $ref: '#/components/schemas/ResponseAuthorized'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.authorized]
              description: Event type identifier

    WebhookEventWaitingAction:
      title: transaction.waiting_action
      description: Transaction awaiting customer action notification
      allOf:
        - $ref: '#/components/schemas/ResponseWaitingAction'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.waiting_action]
              description: Event type identifier

    WebhookEventCancelled:
      title: transaction.cancelled
      description: Cancelled transaction notification
      allOf:
        - $ref: '#/components/schemas/ResponseCancelled'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.cancelled]
              description: Event type identifier

    WebhookEventRejected:
      title: transaction.rejected
      description: Rejected transaction notification
      allOf:
        - $ref: '#/components/schemas/ResponseRejected'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.rejected]
              description: Event type identifier

    WebhookEventRefunded:
      title: transaction.refunded
      description: Refunded transaction notification
      allOf:
        - $ref: '#/components/schemas/ResponseRefunded'
        - type: object
          required:
            - event_type
          properties:
            event_type:
              type: string
              enum: [transaction.refunded]
              description: Event type identifier

    # ── Common ────────────────────────────────────────────────────

    PaymentStatus:
      description: Possible transaction statuses
      type: string
      enum:
        - completed
        - authorized
        - processing
        - waiting_action
        - cancelled
        - rejected
        - refunded
      examples:
        - completed

    ErrorResponse:
      type: object
      description: Standard error response body
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              examples:
                - validation_error
            message:
              type: string
              description: Human-readable error description
              examples:
                - Required field missing