        - details
      properties:
        type:
          type: string
          enum: [threed_secure]
        details:
          description: 3DS authentication parameters
          $ref: '#/components/schemas/ActionDetailsThreeDSecure'

    ActionRedirect:
      title: redirect
      description: Customer redirect required action
      type: object
      required:
        - type
        - details
      properties:
