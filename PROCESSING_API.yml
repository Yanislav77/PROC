      properties:
        type:
          type: string
          enum: [transfer_qr]
        details:
          description: QR code payment parameters
          $ref: '#/components/schemas/ActionDetailsTransferQr'

    ActionTransferAccount:
      title: transfer_account
      description: Manual bank account transfer required action
      type: object
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum: [transfer_account]
        details:
          description: Bank account transfer parameters
          $ref: '#/components/schemas/ActionDetailsTransferAccount'

    ActionTopUpMobile:
      title: top_up_mobile
      description: Mobile top-up required action
      type: object
      required:
        - type
